name: Compiler l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Écrire le projet
        run: |
          cat > settings.gradle.kts <<'FIN_DU_FICHIER'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LecteurTCL"
          include(":app")
          FIN_DU_FICHIER
          cat > build.gradle.kts <<'FIN_DU_FICHIER'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          FIN_DU_FICHIER
          cat > gradle.properties <<'FIN_DU_FICHIER'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          FIN_DU_FICHIER
          mkdir -p app
          cat > app/build.gradle.kts <<'FIN_DU_FICHIER'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "fr.perso.lecteurtcl"
              compileSdk = 35

              defaultConfig {
                  applicationId = "fr.perso.lecteurtcl"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 3
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          FIN_DU_FICHIER
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'FIN_DU_FICHIER'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.NFC" />
              <uses-feature android:name="android.hardware.nfc" android:required="true" />

              <application
                  android:label="Lecteur TCL"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          FIN_DU_FICHIER
          mkdir -p app/src/main/java/fr/perso/lecteurtcl
          cat > app/src/main/java/fr/perso/lecteurtcl/MainActivity.kt <<'FIN_DU_FICHIER'
          package fr.perso.lecteurtcl

          import android.app.Activity
          import android.graphics.Color
          import android.graphics.Typeface
          import android.nfc.NfcAdapter
          import android.nfc.Tag
          import android.nfc.tech.IsoDep
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Locale
          import java.util.TimeZone

          // Lecteur TCL v1.0 : tickets restants + dernières validations (cartes Técély récentes)
          class MainActivity : Activity(), NfcAdapter.ReaderCallback {

              private var nfc: NfcAdapter? = null
              private lateinit var titre: TextView
              private lateinit var nombre: TextView
              private lateinit var note: TextView
              private lateinit var validations: TextView
              private lateinit var details: TextView

              // Application billettique des cartes Técély récentes (sélection partielle)
              private val aid = hex("A000000404")

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  nfc = NfcAdapter.getDefaultAdapter(this)

                  fun tv(size: Float, bold: Boolean = false, color: Int = Color.BLACK) = TextView(this).apply {
                      textSize = size
                      setTextColor(color)
                      gravity = Gravity.CENTER_HORIZONTAL
                      if (bold) setTypeface(typeface, Typeface.BOLD)
                      setPadding(32, 16, 32, 16)
                  }
                  titre = tv(20f, true)
                  nombre = tv(96f, true, Color.rgb(200, 16, 46))
                  note = tv(14f, color = Color.GRAY)
                  validations = tv(17f)
                  details = tv(11f, color = Color.GRAY).apply { typeface = Typeface.MONOSPACE; setTextIsSelectable(true) }

                  titre.text = when {
                      nfc == null -> "Ce téléphone n'a pas de NFC."
                      nfc?.isEnabled == false -> "Active le NFC dans les paramètres, puis reviens ici."
                      else -> "Pose ta carte TCL au dos du téléphone"
                  }

                  setContentView(ScrollView(this).apply {
                      setBackgroundColor(Color.WHITE)
                      addView(LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(0, 96, 0, 48)
                          listOf(titre, nombre, note, validations, details).forEach { addView(it) }
                      })
                  })
              }

              override fun onResume() {
                  super.onResume()
                  nfc?.enableReaderMode(this, this,
                      NfcAdapter.FLAG_READER_NFC_A or NfcAdapter.FLAG_READER_NFC_B or
                          NfcAdapter.FLAG_READER_SKIP_NDEF_CHECK, null)
              }

              override fun onPause() {
                  super.onPause()
                  nfc?.disableReaderMode(this)
              }

              override fun onTagDiscovered(tag: Tag) {
                  try {
                      val iso = IsoDep.get(tag) ?: return afficherErreur("Ce n'est pas une carte TCL.")
                      iso.connect()
                      iso.timeout = 3000
                      iso.use { c ->
                          val sel = c.transceive(byteArrayOf(0x00, 0xA4.toByte(), 0x04, 0x00, aid.size.toByte()) + aid + byteArrayOf(0x00))
                          if (!ok(sel)) return afficherErreur("Carte non reconnue.\n(Les anciennes cartes Técély ne sont pas lisibles par un téléphone.)")

                          // Tickets : fichier SFI 05, compteurs de 3 octets
                          val cpt = lireRecord(c, 0x05, 1)
                          val restants = cpt?.let { val3(it, 0) } ?: 0
                          val carnet = cpt?.let { val3(it, 2) } ?: 0

                          // Validations : fichier SFI 0A, 3 enregistrements (le plus récent d'abord)
                          val evts = (1..3).mapNotNull { lireRecord(c, 0x0A, it) }.mapNotNull { dateValidation(it) }

                          runOnUiThread {
                              titre.text = "Tickets restants"
                              nombre.text = restants.toString()
                              note.text = when {
                                  restants == 0 -> "Aucun ticket à l'unité (abonnement ou carnet vide)"
                                  carnet > 0 -> "sur un carnet de $carnet"
                                  else -> ""
                              }
                              validations.text = if (evts.isEmpty()) "Aucune validation enregistrée"
                                  else "Dernières validations\n\n" + evts.joinToString("\n")
                              details.text = "\n\nSFI 05 : ${cpt?.copyOf(12)?.toHex() ?: "illisible"}"
                          }
                      }
                  } catch (e: Exception) {
                      afficherErreur("Lecture interrompue.\nGarde la carte immobile et réessaie.")
                  }
              }

              private fun afficherErreur(msg: String) = runOnUiThread {
                  titre.text = msg
                  nombre.text = ""; note.text = ""; validations.text = ""; details.text = ""
              }

              private fun lireRecord(c: IsoDep, sfi: Int, rec: Int): ByteArray? {
                  val r = c.transceive(byteArrayOf(0x00, 0xB2.toByte(), rec.toByte(), ((sfi shl 3) or 0x04).toByte(), 0x00))
                  return if (ok(r)) r.copyOf(r.size - 2) else null
              }

              /** Date (14 bits, jours depuis le 01/01/1997) + heure (11 bits, minutes), à partir du bit 16. */
              private fun dateValidation(d: ByteArray): String? {
                  val jours = bits(d, 16, 14)
                  val minutes = bits(d, 30, 11)
                  if (jours == 0 || minutes >= 1440) return null
                  val cal = Calendar.getInstance(TimeZone.getTimeZone("Europe/Paris")).apply {
                      clear(); set(1997, Calendar.JANUARY, 1); add(Calendar.DAY_OF_MONTH, jours)
                  }
                  val jour = SimpleDateFormat("EEE d MMM yyyy", Locale.FRANCE).apply { timeZone = cal.timeZone }.format(cal.time)
                  return "$jour à ${minutes / 60}h${"%02d".format(minutes % 60)}"
              }

              private fun bits(d: ByteArray, debut: Int, n: Int): Int {
                  var v = 0
                  for (i in debut until debut + n) {
                      val octet = d.getOrNull(i / 8)?.toInt() ?: return 0
                      v = (v shl 1) or ((octet shr (7 - i % 8)) and 1)
                  }
                  return v
              }

              private fun val3(d: ByteArray, i: Int): Int {
                  if (d.size < i * 3 + 3) return 0
                  return ((d[i * 3].toInt() and 0xFF) shl 16) or ((d[i * 3 + 1].toInt() and 0xFF) shl 8) or (d[i * 3 + 2].toInt() and 0xFF)
              }

              private fun ok(r: ByteArray) = r.size >= 2 && r[r.size - 2] == 0x90.toByte() && r[r.size - 1] == 0x00.toByte()
              private fun ByteArray.toHex() = joinToString(" ") { "%02X".format(it) }
              private fun hex(s: String) = ByteArray(s.length / 2) { s.substring(it * 2, it * 2 + 2).toInt(16).toByte() }
          }
          FIN_DU_FICHIER
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compiler
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk LecteurTCL.apk
      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere-version
          name: Lecteur TCL
          files: LecteurTCL.apk
          make_latest: true
