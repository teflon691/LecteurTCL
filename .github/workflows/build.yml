name: Compiler l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Écrire le projet
        run: |
          cat > settings.gradle.kts <<'FIN_DU_FICHIER'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LecteurTCL"
          include(":app")
          FIN_DU_FICHIER
          cat > build.gradle.kts <<'FIN_DU_FICHIER'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          FIN_DU_FICHIER
          cat > gradle.properties <<'FIN_DU_FICHIER'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          FIN_DU_FICHIER
          mkdir -p app
          cat > app/build.gradle.kts <<'FIN_DU_FICHIER'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "fr.perso.lecteurtcl"
              compileSdk = 35

              defaultConfig {
                  applicationId = "fr.perso.lecteurtcl"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 2
                  versionName = "0.2"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          FIN_DU_FICHIER
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'FIN_DU_FICHIER'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.NFC" />
              <uses-feature android:name="android.hardware.nfc" android:required="true" />

              <application
                  android:label="Lecteur TCL"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          FIN_DU_FICHIER
          mkdir -p app/src/main/java/fr/perso/lecteurtcl
          cat > app/src/main/java/fr/perso/lecteurtcl/MainActivity.kt <<'FIN_DU_FICHIER'
          package fr.perso.lecteurtcl

          import android.app.Activity
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.graphics.Typeface
          import android.nfc.NfcAdapter
          import android.nfc.Tag
          import android.nfc.tech.IsoDep
          import android.nfc.tech.NfcB
          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          // Version 0.2 : explorateur Calypso (plusieurs AID, sélection par chemin, scan des SFI)
          class MainActivity : Activity(), NfcAdapter.ReaderCallback {

              private var nfc: NfcAdapter? = null
              private lateinit var output: TextView

              private val aids = listOf(
                  "315449432E494341" to "1TIC.ICA",
                  "315449432E49434131" to "1TIC.ICA1",
                  "A0000004040125090101" to "Calypso A0..0101",
                  "A000000291" to "Calypso A000000291",
                  "31544943" to "1TIC (partiel)",
                  "A000000404" to "A000000404 (partiel)",
              )
              private val fids = listOf(
                  0x2001 to "Environnement", 0x2010 to "Validations", 0x2020 to "Contrats",
                  0x2030 to "Contrats 2", 0x2040 to "Evt speciaux", 0x2050 to "Liste contrats",
                  0x2069 to "Compteurs", 0x202A to "Compteur A", 0x202B to "Compteur B",
                  0x202C to "Compteur C", 0x202D to "Compteur D",
              )
              private val sfiCompteurs = setOf(0x19, 0x0A, 0x0B, 0x0C, 0x0D)
              private val fidCompteurs = setOf(0x2069, 0x202A, 0x202B, 0x202C, 0x202D)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  nfc = NfcAdapter.getDefaultAdapter(this)
                  output = TextView(this).apply {
                      typeface = Typeface.MONOSPACE
                      textSize = 12f
                      setTextIsSelectable(true)
                      setPadding(32, 32, 32, 32)
                      text = when {
                          nfc == null -> "Ce téléphone n'a pas de NFC."
                          nfc?.isEnabled == false -> "Active le NFC dans les paramètres, puis reviens ici."
                          else -> "Lecteur TCL v0.2\nPose ta carte au dos du téléphone et garde-la immobile…"
                      }
                  }
                  val copier = Button(this).apply {
                      text = "Copier le résultat"
                      setOnClickListener {
                          val cm = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("Lecture TCL", output.text))
                          Toast.makeText(this@MainActivity, "Copié", Toast.LENGTH_SHORT).show()
                      }
                  }
                  setContentView(LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, 48, 0, 0)
                      addView(copier)
                      addView(ScrollView(this@MainActivity).apply { addView(output) })
                  })
              }

              override fun onResume() {
                  super.onResume()
                  nfc?.enableReaderMode(this, this,
                      NfcAdapter.FLAG_READER_NFC_A or NfcAdapter.FLAG_READER_NFC_B or
                          NfcAdapter.FLAG_READER_SKIP_NDEF_CHECK, null)
              }

              override fun onPause() {
                  super.onPause()
                  nfc?.disableReaderMode(this)
              }

              override fun onTagDiscovered(tag: Tag) {
                  runOnUiThread { output.text = "Lecture en cours, ne bouge pas la carte…" }
                  val r = StringBuilder("Lecteur TCL v0.2\n")
                  try {
                      lire(tag, r)
                  } catch (e: Exception) {
                      r.append("\nERREUR : ${e.message}\n(Carte bougée ? Réessaie en la gardant immobile.)")
                  }
                  runOnUiThread { output.text = r.toString() }
              }

              private fun lire(tag: Tag, r: StringBuilder) {
                  r.append("UID : ${tag.id.toHex()}\n")
                  r.append("Technos : ${tag.techList.joinToString { it.substringAfterLast('.') }}\n")
                  NfcB.get(tag)?.let {
                      r.append("NfcB appData : ${it.applicationData.toHex()}\n")
                      r.append("NfcB protoInfo : ${it.protocolInfo.toHex()}\n")
                  }
                  val iso = IsoDep.get(tag) ?: run { r.append("\nCarte non ISO-DEP."); return }
                  iso.connect()
                  iso.timeout = 5000
                  iso.hiLayerResponse?.let { r.append("HiLayer : ${it.toHex()}\n") }
                  iso.historicalBytes?.let { r.append("Historical : ${it.toHex()}\n") }

                  iso.use { c ->
                      for (cla in listOf(0x00, 0x94)) {
                          val k = "%02X".format(cla)
                          r.append("\n===== Classe $k =====\n")

                          // 1) Sélection par AID
                          for ((aidHex, nom) in aids) {
                              val aid = hex(aidHex)
                              val rep = c.transceive(byteArrayOf(cla.toByte(), 0xA4.toByte(), 0x04, 0x00,
                                  aid.size.toByte()) + aid + byteArrayOf(0x00))
                              r.append("AID $nom : ${sw(rep)}")
                              if (ok(rep)) {
                                  r.append("\n  FCI ${rep.copyOf(rep.size - 2).toHex()}\n")
                                  scanSfi(c, cla, r)
                              } else r.append("\n")
                          }

                          // 2) Sélection par chemin : MF 3F00 puis scan SFI
                          val mf = select(c, cla, 0x3F00)
                          r.append("\nSelect MF 3F00 : ${sw(mf)}\n")
                          if (ok(mf)) scanSfi(c, cla, r)

                          // 3) DF 2000 puis chaque EF par identifiant
                          val df = select(c, cla, 0x2000)
                          r.append("\nSelect DF 2000 : ${sw(df)}\n")
                          if (ok(df)) {
                              for ((fid, nom) in fids) {
                                  val s = select(c, cla, fid)
                                  if (!ok(s)) { r.append("  EF ${"%04X".format(fid)} $nom : ${sw(s)}\n"); continue }
                                  for (rec in 1..3) {
                                      val rep = c.transceive(byteArrayOf(cla.toByte(), 0xB2.toByte(), rec.toByte(), 0x04, 0x00))
                                      if (!ok(rep)) { if (rec == 1) r.append("  EF ${"%04X".format(fid)} $nom : lecture ${sw(rep)}\n"); break }
                                      val d = rep.copyOf(rep.size - 2)
                                      r.append("  EF ${"%04X".format(fid)} $nom rec $rec\n  ${d.toHex()}\n")
                                      if (fid in fidCompteurs) r.append(compteurs(d))
                                  }
                                  select(c, cla, 0x2000)
                              }
                          }
                      }
                  }
              }

              /** Lit l'enregistrement 1 (à 3) des SFI 1 à 30 et n'affiche que ce qui répond. */
              private fun scanSfi(c: IsoDep, cla: Int, r: StringBuilder) {
                  var trouves = 0
                  val erreurs = mutableMapOf<String, Int>()
                  for (sfi in 1..30) {
                      for (rec in 1..3) {
                          val rep = c.transceive(byteArrayOf(cla.toByte(), 0xB2.toByte(), rec.toByte(),
                              ((sfi shl 3) or 0x04).toByte(), 0x00))
                          if (!ok(rep)) {
                              if (rec == 1) { val e = sw(rep); erreurs[e] = (erreurs[e] ?: 0) + 1 }
                              break
                          }
                          trouves++
                          val d = rep.copyOf(rep.size - 2)
                          r.append("  SFI ${"%02X".format(sfi)} rec $rec\n  ${d.toHex()}\n")
                          if (sfi in sfiCompteurs) r.append(compteurs(d))
                      }
                  }
                  r.append("  -> $trouves enregistrement(s) lu(s)")
                  if (erreurs.isNotEmpty()) r.append(", refus : ${erreurs.entries.joinToString { "${it.key} x${it.value}" }}")
                  r.append("\n")
              }

              private fun select(c: IsoDep, cla: Int, fid: Int): ByteArray =
                  c.transceive(byteArrayOf(cla.toByte(), 0xA4.toByte(), 0x00, 0x00, 0x02,
                      (fid shr 8).toByte(), fid.toByte()))

              private fun compteurs(d: ByteArray): String {
                  val sb = StringBuilder()
                  for (i in 0 until d.size / 3) {
                      val v = ((d[i * 3].toInt() and 0xFF) shl 16) or
                              ((d[i * 3 + 1].toInt() and 0xFF) shl 8) or (d[i * 3 + 2].toInt() and 0xFF)
                      if (v != 0) sb.append("    -> compteur n°${i + 1} = $v\n")
                  }
                  return if (sb.isEmpty()) "    (compteurs à 0)\n" else sb.toString()
              }

              private fun ok(r: ByteArray) = r.size >= 2 &&
                  r[r.size - 2] == 0x90.toByte() && r[r.size - 1] == 0x00.toByte()

              private fun sw(r: ByteArray): String {
                  if (r.size < 2) return "vide"
                  val code = r.copyOfRange(r.size - 2, r.size).toHex().replace(" ", "")
                  return code + when (code) {
                      "9000" -> " OK"
                      "6A82" -> " absent"
                      "6982" -> " protégé"
                      "6E00" -> " classe refusée"
                      "6D00" -> " commande inconnue"
                      "6B00", "6A83" -> " enreg. absent"
                      "6986" -> " pas de fichier courant"
                      else -> ""
                  }
              }

              private fun ByteArray.toHex() = joinToString(" ") { "%02X".format(it) }
              private fun hex(s: String) = ByteArray(s.length / 2) { s.substring(it * 2, it * 2 + 2).toInt(16).toByte() }
          }
          FIN_DU_FICHIER
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compiler
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk LecteurTCL.apk
      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere-version
          name: Lecteur TCL
          files: LecteurTCL.apk
          make_latest: true
